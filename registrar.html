<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar doação | Campanha de Doação Agasalho e Ração - 2027</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="registrar">
<header id="topo"></header>
<main>
<h1>Registrar doação</h1>
<form id="formDoacao" class="form">
<label>Tipo
<select id="tipo" required><option value="agasalho">Agasalho (peças)</option><option value="racao">Ração (kg)</option></select></label>
<label><span>Quantidade <span id="unid">(peças)</span></span>
<input id="qtd" type="number" min="0.1" step="0.1" required></label>
<label>Nome do doador
<input id="doador" type="text" maxlength="80" required></label>
<label>Contato do doador (opcional)
<input id="contato" type="text" maxlength="80"></label>
<label>Data
<input id="data" type="date" required></label>
<label>ONG ou abrigo de destino
<select id="abrigo"></select></label>
<label class="largo">Observações
<textarea id="obs" rows="3" maxlength="200" placeholder="Ex.: 5 casacos de adulto, tamanho M, ou 10 kg de ração para cães"></textarea></label>
<button class="btn" type="submit">Salvar doação</button>
<p id="msg" role="status"></p>
</form>
</main>
<footer>Projeto Integrado UNIFEOB, Curso de Análise e Desenvolvimento de Sistemas, 4º trimestre de 2026</footer>
<script src="js/app.js"></script>
</body>
</html>
