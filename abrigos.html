<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abrigos | Campanha de Doação Agasalho e Ração - 2027</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="abrigos">
<header id="topo"></header>
<main>
<h1>Abrigos</h1>
<form id="formAbrigo" class="form">
<label>Tipo de ONG ou abrigo
<select id="tipoAbrigo"><option value="animais">ONG ou abrigo de animais</option><option value="pessoas">ONG ou abrigo de pessoas carentes</option></select></label>
<label>Nome da ONG ou abrigo
<input id="nome" type="text" maxlength="80" required></label>
<label>Cidade
<input id="cidade" type="text" maxlength="60" required></label>
<label>Contato (telefone ou e-mail)
<input id="tel" type="text" maxlength="80"></label>
<button class="btn" type="submit">Cadastrar ONG ou abrigo</button>
</form>
<section><h2>ONGs e abrigos cadastrados</h2><div id="lista" class="tabela"></div></section>
</main>
<footer>Projeto Integrado UNIFEOB, Curso de Análise e Desenvolvimento de Sistemas, 4º trimestre de 2026</footer>
<script src="js/app.js"></script>
</body>
</html>
